name: Sonda źródeł
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python collector/probe2.py
      - run: |
          git config user.name "zbieracz-bot"; git config user.email "zbieracz-bot@users.noreply.github.com"
          git add debug; git commit -qm "Sonda 2" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
