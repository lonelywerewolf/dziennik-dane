name: Zbieracz
on:
  schedule:
    - cron: "*/15 5-21 * * 1-5"   # co 15 min, ok. 6:00–22:45 czasu polskiego, pn–pt
    - cron: "7 7-21 * * 0,6"      # co godzinę w weekend (8:00–22:00 czasu polskiego)
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: zbieracz
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pypdf==5.1.0
      - run: python collector/collect.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      - run: python collector/export.py
      - run: python collector/digest.py
      - name: Zapisz dane
        run: |
          git config user.name "zbieracz-bot"
          git config user.email "zbieracz-bot@users.noreply.github.com"
          git add data config
          if git diff --cached --quiet; then echo "brak zmian"; exit 0; fi
          git commit -q -m "Dane $(TZ=Europe/Warsaw date +'%F %H:%M')"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
      - name: Zapas, gdy harmonogram GitHuba stoi
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$(TZ=Europe/Warsaw date +%H); D=$(TZ=Europe/Warsaw date +%u)
          # dni robocze 6–23: co ~12 min; weekend 8–22: co ~godzinę; noc – nadrabia pierwszy poranny przebieg
          if [ "$D" -gt 5 ]; then WAIT=3000; [ "$H" -lt 8 ] || [ "$H" -ge 22 ] && exit 0; else WAIT=600; [ "$H" -lt 6 ] || [ "$H" -ge 23 ] && exit 0; fi
          LAST=$(gh api "repos/${{ github.repository }}/actions/workflows/collect.yml/runs?event=schedule&per_page=1" --jq '.workflow_runs[0].created_at // "1970-01-01T00:00:00Z"')
          AGE=$(( $(date +%s) - $(date -d "$LAST" +%s) ))
          LIMIT=1800; [ "$D" -gt 5 ] && LIMIT=5400
          if [ "$AGE" -lt "$LIMIT" ]; then echo "harmonogram działa"; exit 0; fi
          QUEUED=$(gh api "repos/${{ github.repository }}/actions/workflows/collect.yml/runs?status=queued" --jq '.total_count')
          if [ "$QUEUED" -gt 0 ]; then exit 0; fi
          sleep $WAIT
          gh workflow run collect.yml --ref main -R ${{ github.repository }}
          echo "harmonogram stoi od ${AGE}s – uruchomiono kolejny przebieg"

