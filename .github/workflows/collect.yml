name: Zbieracz
on:
  schedule:
    - cron: "*/15 5-21 * * 1-5"   # co 15 min, ok. 6:00–22:45 czasu polskiego, pn–pt
    - cron: "7 7-21 * * 0,6"      # co godzinę w weekend (8:00–22:00 czasu polskiego)
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: zbieracz
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pypdf==5.1.0
      - run: python collector/collect.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      - run: python collector/export.py
      - run: python collector/digest.py
      - name: Zapisz dane
        run: |
          git config user.name "zbieracz-bot"
          git config user.email "zbieracz-bot@users.noreply.github.com"
          git add data config
          if git diff --cached --quiet; then echo "brak zmian"; exit 0; fi
          git commit -q -m "Dane $(TZ=Europe/Warsaw date +'%F %H:%M')"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
      - name: Zapas, gdy harmonogram GitHuba stoi
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$(TZ=Europe/Warsaw date +%H); D=$(TZ=Europe/Warsaw date +%u)
          # dni robocze 6–23: co ~12 min; poza tym (noc, weekend) co ~godzinę – łańcuch nigdy się nie urywa
          WAIT=3000
          if [ "$D" -le 5 ] && [ "$H" -ge 6 ] && [ "$H" -lt 23 ]; then WAIT=600; fi
          # Łańcuch ZAWSZE planuje następny przebieg (cron GitHuba bywa nieregularny – 03.11 jeden spóźniony
          # przebieg z harmonogramu zatrzymał łańcuch na 5 h). Duplikaty: po odczekaniu sprawdzamy, czy inny
          # przebieg już czeka lub trwa – wtedy nie dokładamy kolejnego.
          sleep $WAIT
          BUSY=$(gh api "repos/${{ github.repository }}/actions/workflows/collect.yml/runs?per_page=10" --jq "[.workflow_runs[] | select((.status==\"queued\" or .status==\"in_progress\" or .status==\"pending\" or .status==\"waiting\") and .id != ${{ github.run_id }})] | length")
          if [ "$BUSY" -gt 0 ]; then echo "inny przebieg już czeka/trwa – nie dokładam"; exit 0; fi
          gh workflow run collect.yml --ref main -R ${{ github.repository }}
          echo "zaplanowano kolejny przebieg"

