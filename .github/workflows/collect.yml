name: Zbieracz
on:
  schedule:
    - cron: "*/15 5-21 * * 1-5"   # co 15 min, ok. 6:00–22:45 czasu polskiego, pn–pt
    - cron: "7 9 * * 0,6"         # raz dziennie w weekend
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zbieracz
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pypdf==5.1.0
      - run: python collector/collect.py
      - run: python collector/export.py
      - name: Zapisz dane
        run: |
          git config user.name "zbieracz-bot"
          git config user.email "zbieracz-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "brak zmian"; exit 0; fi
          git commit -q -m "Dane $(TZ=Europe/Warsaw date +'%F %H:%M')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
