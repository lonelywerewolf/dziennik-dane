name: Zbieracz
on:
  schedule:
    - cron: "17 * * * *"          # zapas: co godzinę; gdy pętla pracuje, ten przebieg czeka w kolejce i przejmuje pałeczkę
  push:
    paths: [".github/ping"]       # zadania Claude mogą wznowić zbieracza, zmieniając ten plik
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: zbieracz
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pypdf==5.1.0
      - name: Pętla zbierania (~5 h 20 min)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
        run: bash collector/loop.sh
      - name: Następca (z weryfikacją startu)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=${{ github.repository }}; ME=${{ github.run_id }}
          newer() { gh api "repos/$R/actions/workflows/collect.yml/runs?per_page=15" --jq "[.workflow_runs[] | select(.id > $ME and (.status==\"queued\" or .status==\"in_progress\" or .status==\"pending\" or .status==\"waiting\" or .status==\"requested\"))] | length"; }
          for attempt in 1 2 3 4 5 6; do
            N=$(newer || echo 0)
            if [ "$N" -gt 0 ]; then echo "następca czeka w kolejce – OK"; exit 0; fi
            gh workflow run collect.yml --ref main -R "$R" || echo "uruchomienie nieudane (próba $attempt)"
            sleep 45
            # GitHub czasem zwraca 'startup_failure' – wtedy próbujemy ponownie
            LAST=$(gh api "repos/$R/actions/workflows/collect.yml/runs?per_page=5" --jq "[.workflow_runs[] | select(.id > $ME)][0] | (.status + \" \" + (.conclusion // \"\"))" || echo "")
            echo "następca: $LAST"
            case "$LAST" in *startup_failure*|*failure*|"") sleep 30; continue;; *) exit 0;; esac
          done
          echo "::error::nie udało się uruchomić następcy"; exit 1
